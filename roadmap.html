<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PRAVEQ｜学習ロードマップ</title>
  <style>
    :root{--ink:#17241e;--paper:#f6f4ec;--line:#d8d7cf;--accent:#b8ff57}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}.wrap{max-width:880px;margin:auto;padding:36px 20px 80px}.brand{font-size:12px;font-weight:800;letter-spacing:.14em}.title{font-size:36px;margin:10px 0 26px}.tools{display:flex;justify-content:space-between;gap:10px;margin-bottom:18px}.tabs{display:flex;gap:8px}button{border:1px solid var(--ink);background:transparent;padding:10px 14px;font-weight:700;cursor:pointer}.active{background:var(--ink);color:#fff}.save{background:var(--accent)}.panel{display:none}.panel.active{display:block}.card{background:#fff;border:1px solid var(--line);padding:24px}.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:25px}label{display:grid;gap:6px;font-size:12px;font-weight:700}input{width:100%;border:1px solid var(--line);padding:10px;font:inherit;font-weight:400}h2{font-size:18px;margin:28px 0 8px;border-bottom:1px solid var(--line);padding-bottom:8px}h2:first-child{margin-top:0}table{width:100%;border-collapse:collapse}th,td{border:1px solid var(--line);padding:8px;text-align:left}th{background:#f0f0ea;font-size:12px}td:first-child{width:52px;font-weight:800;text-align:center}td input{border:0;padding:2px}@media(max-width:600px){.meta{grid-template-columns:1fr}.tools{flex-direction:column}.card{padding:16px}}@media print{body{background:#fff}.wrap{padding:0;max-width:none}.tools{display:none}.panel{display:none!important}.panel.active{display:block!important}.card{border:0;padding:0}}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="brand">PRAVEQ MENTOR</div>
    <h1 class="title">学習ロードマップ</h1>
    <div class="tools"><div class="tabs"><button class="tab active" data-panel="roadmap">全体</button><button class="tab" data-panel="weekly">週次</button></div><button class="save" onclick="window.print()">印刷・PDF保存</button></div>

    <section id="roadmap" class="panel active"><div class="card">
      <div class="meta"><label>生徒名<input data-save="name" /></label><label>目標級<input data-save="level" /></label><label>受験日<input data-save="exam" type="date" /></label></div>
      <div id="months"></div>
    </div></section>

    <section id="weekly" class="panel"><div class="card">
      <div class="meta"><label>対象週<input data-save="week" placeholder="例：10/1〜10/7" /></label><label>生徒名<input data-save="weekName" /></label><label>目標級<input data-save="weekLevel" /></label></div>
      <h2>今週</h2><table><thead><tr><th>技能</th><th>取り組むこと</th><th>できたこと・課題</th></tr></thead><tbody id="weeklyRows"></tbody></table>
      <h2>来週</h2><table><thead><tr><th>技能</th><th>取り組むこと</th></tr></thead><tbody id="nextRows"></tbody></table>
    </div></section>
  </main>
  <script>
    const store='praveq-roadmap-minimal-v1',data=JSON.parse(localStorage.getItem(store)||'{}'),save=()=>localStorage.setItem(store,JSON.stringify(data));
    const bind=()=>document.querySelectorAll('[data-save]').forEach(el=>{el.value=data[el.dataset.save]||'';el.oninput=()=>{data[el.dataset.save]=el.value;save()}});
    const skills=['R｜Reading','L｜Listening','W｜Writing','S｜Speaking'];
    document.querySelector('#months').innerHTML=[1,2,3].map(month=>`<h2>${month}か月目</h2><table><thead><tr><th>技能</th><th>取り組むこと</th><th>到達目標</th></tr></thead><tbody>${skills.map(skill=>`<tr><td>${skill}</td><td><input data-save="m${month}-${skill[0]}-plan" /></td><td><input data-save="m${month}-${skill[0]}-goal" /></td></tr>`).join('')}</tbody></table>`).join('');
    document.querySelector('#weeklyRows').innerHTML=skills.map(skill=>`<tr><td>${skill}</td><td><input data-save="week-${skill[0]}-plan" /></td><td><input data-save="week-${skill[0]}-result" /></td></tr>`).join('');
    document.querySelector('#nextRows').innerHTML=skills.map(skill=>`<tr><td>${skill}</td><td><input data-save="next-${skill[0]}-plan" /></td></tr>`).join('');
    bind();document.querySelectorAll('.tab').forEach(tab=>tab.onclick=()=>{document.querySelectorAll('.tab,.panel').forEach(x=>x.classList.remove('active'));tab.classList.add('active');document.querySelector('#'+tab.dataset.panel).classList.add('active')});
  </script>
</body>
</html>
